name: Keep Vercel Alive

on:
  schedule:
    - cron: '0 */6 * * *'   # a cada 6 horas (Vercel não dorme, mas mantém o ping de saúde)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://mundi-tkr-sports.vercel.app/)
          echo "Frontend: HTTP $STATUS"
          STATUS2=$(curl -s -o /dev/null -w "%{http_code}" https://mundi-tkr-api.vercel.app/api/health)
          echo "API: HTTP $STATUS2"
