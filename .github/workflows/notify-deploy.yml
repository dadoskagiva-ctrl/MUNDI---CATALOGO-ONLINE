name: Deploy + Notifica Representantes

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy no Vercel (produção)
        id: deploy
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }}
          vercel build --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }} \
            > deploy-url.txt 2>&1
          cat deploy-url.txt
          DEPLOY_URL=$(grep -o 'https://[^[:space:]]*vercel\.app' deploy-url.txt | tail -1)
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Aguarda site entrar no ar
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://mundi-tkr-sports.vercel.app/)
            echo "Tentativa $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then break; fi
            sleep 10
          done

      - name: Notifica representantes sobre atualização
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            https://mundi-tkr-api.vercel.app/api/notify \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.MUNDI_API_KEY }}" \
            -d '{
              "title": "Nova atualização disponível",
              "body": "O catálogo foi atualizado. Toque para abrir a versão mais recente."
            }')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          echo "Notificação ($HTTP_CODE): $BODY"
